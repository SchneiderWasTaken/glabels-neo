name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: upstream
    attributes:
      label: Related upstream gLabels issue (if any)
      placeholder: https://github.com/j-evins/glabels-qt/issues/...
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help test or implement this
