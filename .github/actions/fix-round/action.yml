name: Fix round
description: >
  One round of the fix agent. Three separate steps so that the step holding the model credential never builds or
  runs anything the model wrote, and the steps that do never hold it (see .github/agents/fix-step.mjs).

inputs:
  issue:
    description: Issue number
    required: true
  model:
    description: Model alias for the fix agent
    default: ''
  github-token:
    description: Read-only token used to fetch the issue
    required: true
  claude-token:
    description: Claude OAuth token (only the agent step receives it)
    required: true

runs:
  using: composite
  steps:
    - name: Prepare (no model credential)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_NUMBER: ${{ inputs.issue }}
      run: node .github/agents/fix-step.mjs prepare

    - name: Agent (model credential, edits files only)
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
        FIX_MODEL: ${{ inputs.model }}
      run: node .github/agents/fix-step.mjs agent

    - name: Verify (no model credential - classify, build, test)
      shell: bash
      run: node .github/agents/fix-step.mjs verify
