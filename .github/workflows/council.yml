# Review council for agent-written pull requests.
#
# Independent model reviewers read the same diff (no tools, JSON answer only); a deterministic rule combines
# their verdicts (council-lib.mjs). Approval is a commit status "Council" on the exact reviewed commit, so any
# later push invalidates it. The decide job has no model credential.
#
# Reviewers are the pool in .github/agents/model-policy.mjs: DeepSeek V4.1 flash and GLM 5.3 flash (OpenRouter) and
# Claude Haiku, plus Claude Opus as a required reviewer of `auto-fix` pull requests. A reviewer joins when its secret exists (OPENROUTER_API_KEY, CLAUDE_OAUTH_TOKEN). Nothing else can run.

name: Council

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

concurrency:
  group: council-${{ inputs.pr }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      ok: ${{ steps.prep.outputs.ok }}
      reviewers: ${{ steps.prep.outputs.reviewers }}
    steps:
      - name: Checkout (trusted default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the change
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_OAUTH_TOKEN != '' }}
        run: |
          avail=""
          [ "$HAS_OPENROUTER" = "true" ] && avail="${avail},OPENROUTER_API_KEY"
          [ "$HAS_CLAUDE" = "true" ] && avail="${avail},CLAUDE_CODE_OAUTH_TOKEN"
          AVAILABLE_SECRETS="$avail" node .github/agents/council-prepare.mjs

      - name: Upload input
        if: steps.prep.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: council-input
          path: council-input.json
          retention-days: 7

  review:
    name: Review (${{ matrix.reviewer.id }})
    needs: prepare
    if: needs.prepare.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        reviewer: ${{ fromJSON(needs.prepare.outputs.reviewers) }}
    steps:
      - name: Checkout (trusted default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: council-input

      - name: Set up Claude Code
        if: matrix.reviewer.provider == 'claude'
        uses: ./.github/actions/setup-claude

      - name: Review
        env:
          REVIEWER: ${{ toJSON(matrix.reviewer) }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.reviewer.provider == 'claude' && secrets.CLAUDE_OAUTH_TOKEN || '' }}
          OPENROUTER_API_KEY: ${{ matrix.reviewer.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
        run: node .github/agents/council-review.mjs "$REVIEWER"

      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict-${{ matrix.reviewer.id }}
          path: verdict-*.json
          if-no-files-found: ignore
          retention-days: 7

  decide:
    name: Decide
    needs: [prepare, review]
    if: always() && needs.prepare.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      actions: write
    steps:
      - name: Checkout (trusted default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download input and verdicts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Combine verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/agents/council-decide.mjs
