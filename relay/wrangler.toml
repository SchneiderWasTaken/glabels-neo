# Cloudflare Worker that receives in-app bug reports and files them as GitHub issues.
# See relay/README.md for the one-time setup.

name = "glabels-neo-report"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
GITHUB_REPO = "SchneiderWasTaken/glabels-neo"
# Set to "false" to stop accepting reports (the app then falls back to the browser flow).
ENABLED = "true"
# Proof-of-work difficulty in leading zero bits (each +1 doubles the client's work).
POW_BITS = "18"
# Per-reporter and global limits.
LIMIT_PER_HOUR = "3"
LIMIT_PER_DAY = "8"
LIMIT_GLOBAL_PER_DAY = "100"

# Rate-limit counters.  Wrangler provisions this namespace on first deploy.
[[kv_namespaces]]
binding = "RATE"

# Secrets (set with `wrangler secret put` or by the "Deploy report relay" workflow):
#   CHALLENGE_SECRET            random string used to sign proof-of-work challenges
#   GITHUB_APP_ID               GitHub App that has "Issues: write" on this repository only
#   GITHUB_APP_PRIVATE_KEY      its private key (PEM, PKCS#1 or PKCS#8)
#   GITHUB_APP_INSTALLATION_ID  installation id of the App on this repository
#   GITHUB_TOKEN                alternative to the three App secrets: a fine-grained token with
#                               "Issues: write" on this repository only
