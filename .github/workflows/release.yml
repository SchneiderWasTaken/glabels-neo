# Build, test, package, smoke-test and publish gLabels Neo.
#
#  - push to main          -> rolling "edge" prerelease with the newest build
#  - push of a v* tag      -> stable release (attached to that tag)
#  - pull request touching packaging -> dry run: everything except publishing
#
# Every package is smoke-tested after it is built: it is unpacked into a clean
# location and run with the build machine's Qt environment stripped, so a
# missing library, plugin, translation or license file fails the pipeline
# instead of reaching users.

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    # Everything that can change a package; documentation-only changes do not rebuild.
    # (Path filters do not apply to tag pushes: tags always build.)
    paths:
      - '**'
      - '!docs/**'
      - '!brand/**'
      - '!README.md'
      - '!SECURITY.md'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/PULL_REQUEST_TEMPLATE.md'
      - '!.github/CODEOWNERS'
      - '!.github/dependabot.yml'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/**'
      - '.github/release-notes/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'glabels/CMakeLists.txt'
      - 'glabelsneo/**'
      - 'printing/CMakeLists.txt'
      - 'glabels-fill/**'
      - 'LICENSE'
      - 'CREDITS.md'
      - 'THIRD-PARTY-NOTICES.md'
      - 'glbarcode/LICENSE'
      - 'templates/LICENSE'
  workflow_dispatch:
    inputs:
      publish:
        description: 'On main only: "edge" publishes the edge prerelease (used by the merge automation, whose pushes do not trigger workflows)'
        type: choice
        options: [dry-run, edge]
        default: dry-run

# Publishing runs are queued, never cancelled mid-publish; only superseded PR dry runs are cancelled.
# One queue per ref, whatever started the run: a push to main and a dispatch on main (the merge automation starts
# edge builds that way) must not publish concurrently, or an older commit could finish last and become "edge".
concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ channel
  channel:
    name: Resolve release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
    steps:
      - name: Resolve
        id: resolve
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" && "$PUBLISH" == "edge" ]]; then
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dry-run" >> "$GITHUB_OUTPUT"
          fi

  # -------------------------------------------------------------------- Linux
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04   # oldest supported image: best glibc compatibility
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          cache-key: release

      - name: Configure
        env:
          REPORT_ENDPOINT: ${{ vars.REPORT_ENDPOINT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_PICKER_API_KEY: ${{ vars.GOOGLE_PICKER_API_KEY }}
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DGLABELS_REPORT_ENDPOINT=$REPORT_ENDPOINT"
          "-DGLABELS_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
          "-DGLABELS_GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
          "-DGLABELS_GOOGLE_PICKER_API_KEY=$GOOGLE_PICKER_API_KEY"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        working-directory: build
        run: |
          xvfb-run -a ./glabels/glabels-qt --Version
          xvfb-run -a ctest --build-config Release --output-on-failure

      - name: Package tarball
        run: ./scripts/package-linux.sh build glabels-neo-linux-x86_64.tar.gz

      - name: Smoke test (unpack, strict environment, render a label to PDF)
        run: |
          set -euo pipefail
          rm -rf smoke && mkdir smoke
          tar -xzf glabels-neo-linux-x86_64.tar.gz -C smoke
          cd smoke/glabels-neo

          for f in LICENSE THIRD-PARTY-NOTICES.md CREDITS.md licenses/GPL-3.0.txt licenses/LGPL-3.0.txt licenses/templates-MIT.txt licenses/libzint-BSD-3-Clause.txt licenses/LGPL-2.1.txt licenses/zlib.txt licenses/ICU-Unicode-3.0.txt licenses/qt/MIT.txt VERSIONS.txt bin/glabels-updater glabelsneo glabels-batch-qt; do
            test -f "$f" || { echo "missing from package: $f"; exit 1; }
          done

          # Strip the Qt environment that install-qt-action exported to the job, so that only
          # the bundle (and the base system) can satisfy dependencies - like on a user's machine.
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QT_ROOT_DIR QML2_IMPORT_PATH QT_QPA_PLATFORM_PLUGIN_PATH

          # Binaries and bundled libraries must resolve every dependency.
          missing=0
          while IFS= read -r -d '' bin; do
            if [[ "$(file -b "$bin")" == *ELF* ]]; then
              ldd_out="$(LD_LIBRARY_PATH="$PWD/lib" ldd "$bin" 2>/dev/null || true)"
              if grep 'not found' <<< "$ldd_out" >/dev/null; then
                echo "unresolved libraries in $bin:"
                grep 'not found' <<< "$ldd_out"
                missing=1
              fi
            fi
          done < <(find bin lib -type f -print0)
          test "$missing" -eq 0

          # Plugins: report only (a plugin may need a system library the runner lacks).
          while IFS= read -r -d '' plugin; do
            ldd_out="$(LD_LIBRARY_PATH="$PWD/lib" ldd "$plugin" 2>/dev/null || true)"
            if grep 'not found' <<< "$ldd_out" >/dev/null; then
              echo "::warning::plugin ${plugin#./} has unresolved dependencies: $(grep 'not found' <<< "$ldd_out" | tr -d '\t' | tr '\n' ' ')"
            fi
          done < <(find plugins -type f -name '*.so' -print0)

          export QT_QPA_PLATFORM=offscreen
          ./glabelsneo --Version | tee version.txt
          grep 'GLABELS NEO' version.txt >/dev/null

          ./glabelsneo print "$GITHUB_WORKSPACE/test-data/simple-shapes.glabels" --output "$PWD/out.pdf"
          test "$(head -c 4 out.pdf)" = "%PDF"
          test "$(stat -c %s out.pdf)" -gt 1000

          # The previous tool still ships for one release: installed copies' self-updater requires it and
          # smoke-tests every update with "--Version", so that must keep working.
          ./glabels-batch-qt --Version | grep 'GLABELS NEO' >/dev/null

          # Batch input: JSON records rendered to PDF through the real tool.
          printf '[{"a":"one"},{"a":"two","_copies":2}]' > records.json
          ./glabelsneo print "$GITHUB_WORKSPACE/test-data/simple-text-liberation-sans.glabels" --data records.json --output "$PWD/batch.pdf" --format json | tee batch.json
          grep '"ok":true' batch.json >/dev/null
          test "$(head -c 4 batch.pdf)" = "%PDF"
          ./glabelsneo printers --format json >/dev/null

      - name: Report system libraries missing on a bare Ubuntu 22.04 (informational)
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/smoke/glabels-neo:/app:ro" \
            -v "$PWD/scripts/report-missing-libs.sh:/report.sh:ro" \
            ubuntu:22.04 bash /report.sh | tee missing-libs.txt
          {
            echo '### System libraries a user must provide (bare Ubuntu 22.04)'
            echo 'Count = number of bundled files that need the library.'
            echo '```'
            cat missing-libs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run in a bare Ubuntu container (informational)
        continue-on-error: true
        run: |
          docker run --rm -e QT_QPA_PLATFORM=offscreen \
            -v "$PWD/smoke/glabels-neo:/app:ro" ubuntu:22.04 \
            bash -c 'apt-get update -qq && apt-get install -y -qq libfontconfig1 libfreetype6 libglib2.0-0 libxkbcommon0 libdbus-1-3 >/dev/null && /app/glabelsneo --Version'

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-linux
          path: glabels-neo-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ------------------------------------------------------------------ Windows
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build

      - name: Configure
        env:
          REPORT_ENDPOINT: ${{ vars.REPORT_ENDPOINT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_PICKER_API_KEY: ${{ vars.GOOGLE_PICKER_API_KEY }}
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DGLABELS_REPORT_ENDPOINT=$env:REPORT_ENDPOINT"
          "-DGLABELS_GOOGLE_CLIENT_ID=$env:GOOGLE_CLIENT_ID"
          "-DGLABELS_GOOGLE_CLIENT_SECRET=$env:GOOGLE_CLIENT_SECRET"
          "-DGLABELS_GOOGLE_PICKER_API_KEY=$env:GOOGLE_PICKER_API_KEY"
          "-DCMAKE_TOOLCHAIN_FILE=${{ env.TOOLCHAIN_FILE }}"

      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Test
        working-directory: build
        env:
          QT_ASSUME_STDERR_HAS_CONSOLE: 1
        run: |
          ./glabelsneo/Release/glabelsneo --Version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --build-config Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir build -OutZip glabels-neo-windows-x64.zip

      - name: Smoke test (unzip, clean PATH, render a label to PDF)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'smoke'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          Expand-Archive glabels-neo-windows-x64.zip -DestinationPath $dir

          foreach ($f in 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'CREDITS.md', 'licenses\GPL-3.0.txt', 'licenses\LGPL-3.0.txt', 'licenses\templates-MIT.txt', 'licenses\libzint-BSD-3-Clause.txt', 'licenses\LGPL-2.1.txt', 'licenses\zlib.txt', 'licenses\ICU-Unicode-3.0.txt', 'licenses\qt\MIT.txt', 'VERSIONS.txt', 'bin\glabels-updater.exe', 'bin\glabelsneo.exe', 'bin\glabels-batch-qt.exe', 'bin\translations\glabels_de.qm') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing from package: $f" }
          }

          # Strip PATH and the Qt environment exported by install-qt-action, so DLLs and plugins can
          # only come from the package itself (this is what a user's machine looks like).
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($v in 'QT_PLUGIN_PATH', 'QT_ROOT_DIR', 'QML2_IMPORT_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH') {
            Remove-Item "Env:$v" -ErrorAction SilentlyContinue
          }
          $exe = Join-Path $dir 'bin\glabelsneo.exe'
          $legacyExe = Join-Path $dir 'bin\glabels-batch-qt.exe'

          $out = & $exe --Version
          if ($LASTEXITCODE -ne 0) { throw "--Version exited with $LASTEXITCODE" }
          $out | ForEach-Object { Write-Host $_ }
          if (-not (($out -join "`n") -match 'GLABELS NEO')) { throw 'version output lacks the gLabels Neo header' }

          $pdf = Join-Path $dir 'out.pdf'
          & $exe print (Join-Path $env:GITHUB_WORKSPACE 'test-data\simple-shapes.glabels') --output $pdf
          if ($LASTEXITCODE -ne 0) { throw "render exited with $LASTEXITCODE" }
          $bytes = [System.IO.File]::ReadAllBytes($pdf)
          if ($bytes.Length -lt 1000) { throw "PDF too small: $($bytes.Length) bytes" }
          if ([System.Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne '%PDF') { throw 'output is not a PDF' }

          # The previous tool still ships for one release: installed copies' self-updater requires it and
          # smoke-tests every update with "--Version", so that must keep working.
          $legacyOut = & $legacyExe --Version
          if ($LASTEXITCODE -ne 0) { throw "glabels-batch-qt --Version exited with $LASTEXITCODE" }
          if (-not (($legacyOut -join "`n") -match 'GLABELS NEO')) { throw 'glabels-batch-qt version output lacks the gLabels Neo header' }

          # Batch input: JSON records, a field set, and a job document, all rendered to PDF through the real tool.
          $json = Join-Path $dir 'records.json'
          '[{"a":"one"},{"a":"two","_copies":2}]' | Out-File -Encoding ascii $json
          $pdf2 = Join-Path $dir 'batch.pdf'
          $summary = & $exe print (Join-Path $env:GITHUB_WORKSPACE 'test-data\simple-text-liberation-sans.glabels') --data $json --output $pdf2 --format json
          if ($LASTEXITCODE -ne 0) { throw "batch render exited with $LASTEXITCODE" }
          if (-not (($summary -join "`n") -match '"ok":true')) { throw "batch render did not report ok: $summary" }
          $printers = & $exe printers --format json
          if ($LASTEXITCODE -ne 0) { throw "printers exited with $LASTEXITCODE" }

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-windows
          path: glabels-neo-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # -------------------------------------------------------------------- macOS
  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          cache-key: release

      - name: Configure
        env:
          REPORT_ENDPOINT: ${{ vars.REPORT_ENDPOINT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_PICKER_API_KEY: ${{ vars.GOOGLE_PICKER_API_KEY }}
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DGLABELS_REPORT_ENDPOINT=$REPORT_ENDPOINT"
          "-DGLABELS_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
          "-DGLABELS_GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
          "-DGLABELS_GOOGLE_PICKER_API_KEY=$GOOGLE_PICKER_API_KEY"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        working-directory: build
        run: |
          ./glabels/glabels-qt.app/Contents/MacOS/glabels-qt --Version
          ctest --build-config Release --output-on-failure

      - name: Package DMG
        run: ./scripts/package-macos.sh build glabels-neo-macos-arm64.dmg

      - name: Smoke test (mount DMG, verify signature, no build-machine paths, run)
        run: |
          set -euo pipefail
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" glabels-neo-macos-arm64.dmg
          trap 'hdiutil detach "$mnt" -force || true' EXIT

          for f in LICENSE THIRD-PARTY-NOTICES.md CREDITS.md licenses/GPL-3.0.txt licenses/LGPL-3.0.txt licenses/templates-MIT.txt licenses/libzint-BSD-3-Clause.txt licenses/LGPL-2.1.txt licenses/zlib.txt licenses/ICU-Unicode-3.0.txt licenses/qt/MIT.txt VERSIONS.txt; do
            test -f "$mnt/$f" || { echo "missing from DMG: $f"; exit 1; }
          done

          # The in-app updater needs its helper next to the main program; without it updates silently stop.
          test -x "$mnt/glabels-qt.app/Contents/MacOS/glabels-updater" || { echo "update helper missing from glabels-qt.app"; exit 1; }

          bad=0
          for app in glabels-qt.app glabels-fill.app; do
            codesign --verify --deep --strict "$mnt/$app"
            # Bundled binaries must not reference libraries on the build machine. Only dependency
            # lines (tab-indented) are inspected: universal binaries print one header line per
            # architecture, and those start with this machine's path.
            while IFS= read -r -d '' f; do
              if [[ "$(file -b "$f")" == *Mach-O* ]]; then
                deps="$(otool -L "$f" | awk '/^\t/ {print $1}')"
                if grep -E '^(/opt/homebrew|/usr/local|/Users/|/Applications/Xcode)' <<< "$deps"; then
                  echo "build-machine path referenced from $f"
                  bad=1
                fi
              fi
            done < <(find "$mnt/$app" -type f -print0)
          done
          test "$bad" -eq 0

          # Strip the Qt environment exported by install-qt-action, so only the bundle can satisfy it.
          env -u QT_PLUGIN_PATH -u QT_ROOT_DIR -u QML2_IMPORT_PATH -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH \
            "$mnt/glabels-qt.app/Contents/MacOS/glabels-qt" --Version | tee version.txt
          grep 'GLABELS NEO' version.txt >/dev/null

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-macos
          path: glabels-neo-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ------------------------------------------------------------------ publish
  publish:
    name: Publish (${{ needs.channel.outputs.channel }})
    needs: [channel, linux, windows, macos]
    if: needs.channel.outputs.channel != 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # create the release and move the edge tag
      id-token: write        # build provenance attestation
      attestations: write
    env:
      CHANNEL: ${{ needs.channel.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum glabels-neo-* | tee SHA256SUMS

      # What the in-app updater reads: a small manifest at a fixed URL per channel (see the script).
      # Generated before attestation so that it is covered by the build provenance as well.
      - name: Update manifest
        run: |
          if [ "$CHANNEL" = "edge" ]; then tag=edge; else tag="$GITHUB_REF_NAME"; fi
          # Clients order edge builds by the commit time and never move to an older one.
          commit_time="$(git show -s --format=%ct "$GITHUB_SHA")"
          ./scripts/make-update-manifest.sh dist "$CHANNEL" "$tag" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$commit_time"
          cat dist/glabels-neo-update-manifest.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/glabels-neo-*'

      - name: Compose release notes
        run: |
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          if [ "$CHANNEL" = "edge" ]; then
            tag="$GITHUB_SHA"   # exact commit: the moving "edge" tag is not a stable reference
            {
              echo "**Edge build** of commit \`${GITHUB_SHA::7}\` - the newest build of the \`main\` branch."
              echo "It passed all tests, but it is not a stable release. For a stable version use the latest release."
              echo
            } > notes.md
          else
            tag="$GITHUB_REF_NAME"
            : > notes.md
          fi
          sed -e "s|@TAG@|${tag}|g" -e "s|@REPO_URL@|${repo_url}|g" -e "s|@REPO@|${GITHUB_REPOSITORY}|g" \
            .github/release-notes/footer.md >> notes.md
          cat notes.md

      # The edge release is updated in place (tag moved, assets replaced) rather than deleted and
      # recreated: deleting a release and its tag is asynchronous on GitHub's side and races with
      # the re-creation.
      - name: Publish edge release
        if: env.CHANNEL == 'edge'
        run: |
          set -euo pipefail
          # Never publish an edge build that a newer commit has already superseded: clients treat "edge" as the newest
          # build, so publishing an older one would move them backwards.
          # (Only commits that start their own build count: documentation-only commits are excluded from this
          # workflow's push trigger, so they must not make an earlier build look superseded.)
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            newer="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${tip}" \
              --jq '[.files[].filename | select(test("^(docs|brand)/|^README[.]md$|^SECURITY[.]md$|^[.]github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE[.]md$|CODEOWNERS$|dependabot[.]yml$)") | not)] | length')"
            if [ "$newer" -gt 0 ]; then
              echo "edge build of ${GITHUB_SHA::7} is superseded by ${tip::7}; not publishing it"
              exit 0
            fi
          fi
          # The manifest goes last: it must never describe a package that has not been replaced yet.
          packages=()
          for f in dist/*; do
            [ "$(basename "$f")" = glabels-neo-update-manifest.json ] || packages+=("$f")
          done
          if gh release view edge >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/edge" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit edge \
              --prerelease \
              --title "Edge build (${GITHUB_SHA::7})" \
              --notes-file notes.md
            gh release upload edge "${packages[@]}" --clobber
          else
            gh release create edge "${packages[@]}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Edge build (${GITHUB_SHA::7})" \
              --notes-file notes.md
          fi
          gh release upload edge dist/glabels-neo-update-manifest.json --clobber

      - name: Publish stable release
        if: env.CHANNEL == 'stable'
        run: |
          set -euo pipefail
          packages=()
          for f in dist/*; do
            [ "$(basename "$f")" = glabels-neo-update-manifest.json ] || packages+=("$f")
          done
          gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
            --verify-tag \
            --title "gLabels Neo ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes-file notes.md
          # Last, so that the manifest found through "latest" always has its packages in place.
