# Fix agent (automation level >= 2): attempt a fix for one issue and open a DRAFT pull request.
#
# Started by a maintainer applying the `agent-fix` or `auto-fix` label (auto-fix also allows a SMALL interface change and a
# merge without a person; see autofix.mjs), or (level >= 3) by triage marking an issue `agent-ready`.
#
# Security shape - the issue text is untrusted input to a model that can edit files:
#   rounds (agent-fix-round.yml): per round, an "agent" job that holds the model credential and only edits files in a
#             plain copy of the tree, and a "verify" job on a separate machine with NO secret that classifies,
#             builds and tests what the model wrote. At most two rounds.
#   publish:  holds write access but NO model credential. Re-validates the patch and opens a draft PR.
# The issue text is pinned: if it is edited after approval, the attempt stops.
# Changes to .github/, build files, scripts, packaging or credentials are refused by policy (policy.mjs).

name: Agent fix

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to attempt
        required: true
      body_sha:
        description: Fingerprint of the issue text triage saw (set by the automation; leave empty when running by hand)
        required: false
        default: ''
  issues:
    types: [labeled]

concurrency:
  group: agent-fix-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-fix' || github.event.label.name == 'auto-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.eligible.outputs.run }}
      issue: ${{ steps.eligible.outputs.issue }}
      body_sha: ${{ steps.eligible.outputs.body_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Automation level and daily cap
        id: level
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_LEVEL: ${{ vars.AUTOMATION_LEVEL }}
          FIX_MAX_PER_DAY: ${{ vars.FIX_MAX_PER_DAY }}
        run: node .github/agents/gate.mjs fix

      - name: Eligibility
        id: eligible
        env:
          GH_TOKEN: ${{ github.token }}
          LEVEL_OK: ${{ steps.level.outputs.run }}
          ACTOR: ${{ github.actor }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          EXPECTED_BODY_SHA: ${{ inputs.body_sha }}
        run: node .github/agents/fix-gate.mjs

  round1:
    name: Round 1
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/agent-fix-round.yml
    with:
      round: 1
      issue: ${{ needs.gate.outputs.issue }}
      body_sha: ${{ needs.gate.outputs.body_sha }}
    secrets:
      CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  round2:
    name: Round 2
    needs: [gate, round1]
    if: needs.round1.outputs.status == 'continue'
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/agent-fix-round.yml
    with:
      round: 2
      prev_round: 1
      issue: ${{ needs.gate.outputs.issue }}
      body_sha: ${{ needs.gate.outputs.body_sha }}
    secrets:
      CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  publish:
    name: Open draft PR
    needs: [gate, round1, round2]
    if: >-
      always() && needs.gate.outputs.run == 'true' &&
      ((needs.round1.outputs.status != '' && needs.round1.outputs.status != 'continue') ||
       (needs.round2.outputs.status != '' && needs.round2.outputs.status != 'continue'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Download result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-result

      - name: Open the draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ needs.gate.outputs.issue }}
        run: node .github/agents/fix-publish.mjs

  failed:
    name: Report failure
    needs: [gate, round1, round2]
    if: always() && needs.gate.outputs.run == 'true' && (needs.round1.result == 'failure' || needs.round2.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Ask for a human
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.gate.outputs.issue }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/labels" --method POST -f 'labels[]=needs-human' >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" --method POST \
            -f body="The automatic fix attempt stopped before it produced a result (it may have run into a problem, or the issue text was edited after it was approved). A maintainer needs to look at this one." >/dev/null

  queue:
    name: Wait for the usage limit
    needs: [gate, round1, round2]
    # Every model was at a usage limit: park the issue; agent-dispatch.yml starts it again when the limit is over.
    if: always() && needs.gate.outputs.run == 'true' && (needs.round1.outputs.limited == 'true' || needs.round2.outputs.limited == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Park the issue
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: fix
          NUMBER: ${{ needs.gate.outputs.issue }}
          SHA: ${{ needs.gate.outputs.body_sha }}
          UNTIL: ${{ needs.round2.outputs.until || needs.round1.outputs.until }}
        run: node .github/agents/queue.mjs hold

      # A run that only waited is not an attempt: ending it as cancelled keeps it out of the daily cap (gate.mjs). A run whose
      # first round already did the work (round 2 was limited) stays counted.
      - name: End this run without counting it
        if: needs.round1.outputs.limited == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The cancel request is asynchronous: keep this step alive until the runner is stopped, or the run would end as a success.
        run: |
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          sleep 90

      # If parking itself failed the issue would be dropped without a word: ask for a person instead.
      - name: Ask for a person if parking failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.gate.outputs.issue }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/labels" --method POST -f 'labels[]=needs-human' >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" --method POST \
            -f body="The automatic fix had to wait for a usage limit and could not be queued. A maintainer needs to look at this one." >/dev/null
